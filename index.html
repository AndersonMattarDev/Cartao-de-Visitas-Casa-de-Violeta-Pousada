<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Casa de Violeta Pousada | Cartão Virtual</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <style>
      * {
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(
            circle at top left,
            rgba(255, 255, 255, 0.18),
            transparent 30%
          ),
          radial-gradient(
            circle at bottom right,
            rgba(146, 90, 181, 0.25),
            transparent 35%
          ),
          linear-gradient(135deg, #2b122f, #4a1d4f, #672d72);
        display: flex;
        justify-content: center;
        align-items: center;
        color: #fff;
        position: relative;
        overflow-x: hidden;
        overflow: hidden;
      }

      body::before {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(2px);
        z-index: 0;
      }

      .card {
        position: relative;
        z-index: 1;
        width: min(400px, calc(100% - 24px));
        max-width: 400px;
        max-height: calc(100dvh - 24px);
        margin: 12px 0;
        display: flex;
        flex-direction: column;
        gap: 14px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 20px;
        padding: 30px 20px;
        text-align: center;
        box-shadow: 0 12px 30px rgba(20, 0, 30, 0.28);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
      }

      .photo {
        width: 200px;
        height: 200px;
        object-fit: cover;
        object-position: top 10%;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid #fff;
        margin: 0 auto;
      }

      h1 {
        margin: 0;
        font-size: 22px;
      }

      p {
        margin: 0;
        font-size: 14px;
        opacity: 0.9;
      }

      .btn {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 48px;
        padding: 14px 48px;
        margin: 0;
        border-radius: 10px;
        text-decoration: none;
        color: #ffffff;
        font-weight: bold;
        transition: transform 0.2s ease;
      }

      .btn i {
        position: absolute;
        left: 16px;
        text-align: center;
      }

      .btn:hover {
        transform: scale(1.03);
      }

      .whatsapp {
        background: linear-gradient(135deg, #25d366, #128c7e);
        box-shadow: 0 6px 15px rgb(44, 39, 45);
      }

      .facebook {
        background: linear-gradient(135deg, #1877f2, #0d47a1);
        box-shadow: 0 6px 15px rgb(44, 39, 45);
      }

      .instagram {
        background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af);
        box-shadow: 0 6px 15px rgb(44, 39, 45);
      }
      .last-project {
        background: linear-gradient(135deg, #972fb7, #46034e);
        box-shadow: 0 6px 15px rgb(44, 39, 45);
      }

      .qr-container {
        margin: 0;
        text-align: center;
      }

      .qr-container img {
        width: 140px;
        height: 140px;
        border-radius: 12px;
        background: #fff;
        padding: 8px;
      }

      .qr-container span {
        display: block;
        margin-top: 8px;
        font-size: 12px;
        opacity: 0.8;
      }

      footer {
        margin: 0;
        margin-top: 8px;
        font-size: 10px;
        opacity: 0.7;
      }

      @media (max-width: 600px), (max-height: 850px) {
        body {
          align-items: flex-start;
        }

        .card {
          min-height: calc(100dvh - 24px);
          padding: 24px 18px;
          gap: 10px;
        }

        .photo {
          width: 130px;
          height: 130px;
        }

        h1 {
          font-size: 21px;
          margin-top: 20px;
        }

        p {
          margin: 0;
          margin-bottom: 40px;
        }

        .btn {
          min-height: 44px;
          padding: 11px 44px;
        }

        .btn i {
          left: 14px;
        }

        .qr-container {
          margin: 0;
          margin-top: 40px;
        }

        .qr-container img {
          width: 100px;
          height: 100px;
        }

        .qr-container span {
          margin-top: 4px;
        }

        footer {
          margin: 0;
          margin-top: 40px;
        }
        footer a {
          font-size: 9px;
          text-decoration: none;
          color: #fff;
        }
      }
    </style>
  </head>

  <body>
    <div class="card">
      <img src="logo.svg" alt="Casa de Violeta Pousada" class="photo" />

      <h1>Casa de Violeta Pousada</h1>
      <p>Requinte e conforto para sua estadia.</p>

      <a
        class="btn whatsapp"
        href="https://wa.me/5532984409797"
        target="_blank"
        rel="noopener noreferrer"
      >
        <i class="fa-brands fa-whatsapp" aria-hidden="true"></i> WhatsApp
      </a>

      <a class="btn facebook" href="https://www.facebook.com/share/1Etm3Rj9e4/" target="_blank" rel="noopener noreferrer">
        <i class="fa-brands fa-facebook" aria-hidden="true"></i> Facebook
      </a>

      <a
        class="btn instagram"
        href="https://www.instagram.com/casadevioletapousada/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <i class="fa-brands fa-instagram" aria-hidden="true"></i> Instagram
      </a>

      <a
        class="btn last-project"
        href="https://www.casadevioletapousada.com.br/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <i class="fa-solid fa-globe" aria-hidden="true"></i> Visite nosso site!
      </a>

      <div class="qr-container">
        <img src="qrCode.png" alt="QR Code do cartão de visitas" />
        <span>Escaneie para acessar</span>
      </div>

      <footer>Cartão de visitas virtual |<a href="https://portfolio-ten-ashen-18.vercel.app/" target="_blank" rel="noopener noreferrer"> Design by Anderson Mattar</a></footer>
      
    </div>
  </body>
 
</html>
